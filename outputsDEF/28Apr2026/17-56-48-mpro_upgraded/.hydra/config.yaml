general:
  name: mpro_upgraded
  wandb: online
  gpus: 1
  resume: null
  test_only: null
  check_val_every_n_epochs: 5
  sample_every_val: 4
  val_check_interval: null
  samples_to_generate: 512
  samples_to_save: 20
  chains_to_save: 1
  log_every_steps: 50
  number_chain_steps: 50
  final_model_samples_to_generate: 10000
  final_model_samples_to_save: 30
  final_model_chains_to_save: 20
  evaluate_all_checkpoints: false
model:
  type: discrete
  transition: marginal
  model: graph_tf
  diffusion_steps: 500
  diffusion_noise_schedule: cosine
  n_layers: 3
  dropout: 0.2
  extra_features: all
  hidden_mlp_dims:
    X: 128
    E: 64
    'y': 64
  hidden_dims:
    dx: 128
    de: 32
    dy: 32
    n_head: 4
    dim_ffX: 128
    dim_ffE: 64
    dim_ffy: 64
  lambda_train:
  - 5
  - 1
train:
  n_epochs: 500
  batch_size: 32
  lr: 0.0002
  clip_grad: 1.0
  save_model: true
  num_workers: 0
  ema_decay: 0.999
  early_stopping_patience: 50
  lr_scheduler: cosine
  lr_scheduler_min_lr: 1.0e-06
  lr_scheduler_gamma: 0.99
  progress_bar: false
  weight_decay: 1.0e-12
  optimizer: adamw
  seed: 0
dataset:
  name: mpro
  datadir: data/mpro/
  raw_data_dir: null
  remove_h: true
  random_subset: null
  pin_memory: true
